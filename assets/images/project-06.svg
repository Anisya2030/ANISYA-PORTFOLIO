          <text x="0" y="-30" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#30343B">Fuzzy K-NN</text>
          <text x="0" y="-12" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#777B80">Membership Degree μ(x)</text>
          <rect x="-60" y="5" width="120" height="20" rx="10" fill="#FAF9F6" stroke="#E2E0D8"/>
          <text x="0" y="19" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="600" fill="#30343B">Optimized Metric</text>
          <text x="0" y="42" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#777B80">Scikit-learn • Python</text>
        </g>
        

