          <text x="0" y="52" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#777B80">WDBC Dataset • SMOTE Oversampling</text>
        </g>
        <!-- Arrow -->
        <path d="M 345 110 L 395 110 M 385 102 L 395 110 L 385 118" stroke="#9BAFC0" stroke-width="2" fill="none"/>
