  <text x="760" y="20" text-anchor="end" font-family="'Newsreader', Georgia, serif" font-size="12" font-style="italic" fill="#9BAFC0">Portfolio Dossier</text>

  <!-- Center Graphic Diagram -->
  
        <!-- Breast Cancer Classification Visual -->
        <g transform="translate(200, 110)">
          <!-- Scatter Plot Frame -->
          <rect x="-120" y="-60" width="240" height="120" rx="6" fill="#FFFFFF" stroke="#DCD9D0" stroke-width="1.5"/>
