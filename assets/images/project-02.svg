<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <pattern id="grid_02" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#EAE8E1" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="240" fill="#FAF9F6"/>
  <rect width="800" height="240" fill="url(#grid_02)"/>

  <!-- Top bar / Editorial Header -->
  <line x1="30" y1="26" x2="770" y2="26" stroke="#E2E0D8" stroke-width="1"/>
  <text x="40" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#777B80" letter-spacing="1">PROJECT 02 // ML / DECISION SUPPORT SYSTEM</text>
  <text x="760" y="20" text-anchor="end" font-family="'Newsreader', Georgia, serif" font-size="12" font-style="italic" fill="#9BAFC0">Portfolio Dossier</text>

  <!-- Center Graphic Diagram -->
  
        <!-- Skincare DSS Matrix -->
        <g transform="translate(200, 110)">
          <!-- Criteria Card -->
          <rect x="-130" y="-60" width="260" height="120" rx="6" fill="#FFFFFF" stroke="#DCD9D0" stroke-width="1.5"/>
          <text x="-110" y="-35" font-family="sans-serif" font-size="11" font-weight="bold" fill="#30343B">Decision Support System (SAW)</text>
          <line x1="-110" y1="-20" x2="110" y2="-20" stroke="#FAF9F6" stroke-width="1"/>
          <!-- Matrix bars -->
          <g transform="translate(-110, -5)">
            <text x="0" y="0" font-family="sans-serif" font-size="10" fill="#777B80">Skin Type Weight (W1)</text>
            <rect x="130" y="-8" width="85" height="10" rx="5" fill="#9BAFC0"/>
            <text x="0" y="20" font-family="sans-serif" font-size="10" fill="#777B80">Ingredient Match (W2)</text>
            <rect x="130" y="12" width="70" height="10" rx="5" fill="#B8C5B5"/>
            <text x="0" y="40" font-family="sans-serif" font-size="10" fill="#777B80">Sensitivity Tolerance</text>
            <rect x="130" y="32" width="60" height="10" rx="5" fill="#E2E0D8"/>
          </g>
        </g>
        <!-- Arrow -->
        <path d="M 355 110 L 405 110 M 395 102 L 405 110 L 395 118" stroke="#9BAFC0" stroke-width="2" fill="none"/>
        <!-- Recommendation Output -->
        <g transform="translate(510, 110)">
          <rect x="-90" y="-60" width="180" height="120" rx="6" fill="#FFFFFF" stroke="#9BAFC0" stroke-width="1.5"/>
          <circle cx="0" cy="-20" r="18" fill="#B8C5B5" opacity="0.3"/>
          <path d="M -8 -20 L -2 -14 L 8 -26" stroke="#30343B" stroke-width="2" fill="none"/>
          <text x="0" y="15" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#30343B">Ranked Products</text>
          <text x="0" y="35" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#777B80">Normalized Vi Matrix</text>
        </g>
        

  <!-- Footer Tag Strip -->
  <line x1="30" y1="195" x2="770" y2="195" stroke="#E2E0D8" stroke-width="1"/>
  
        <g transform="translate(40, 208)">
          <rect x="0" y="0" width="100" height="22" rx="4" fill="#FAF9F6" stroke="#E2E0D8"/>
          <text x="50" y="15" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#30343B">Python</text>
        </g>
        <g transform="translate(150, 208)">
          <rect x="0" y="0" width="100" height="22" rx="4" fill="#FAF9F6" stroke="#E2E0D8"/>
          <text x="50" y="15" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#30343B">Pandas</text>
        </g>
        <g transform="translate(260, 208)">
          <rect x="0" y="0" width="100" height="22" rx="4" fill="#FAF9F6" stroke="#E2E0D8"/>
          <text x="50" y="15" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#30343B">Scikit-learn</text>
        </g>
        <g transform="translate(370, 208)">
          <rect x="0" y="0" width="100" height="22" rx="4" fill="#FAF9F6" stroke="#E2E0D8"/>
          <text x="50" y="15" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#30343B">SAW</text>
        </g>
  <text x="760" y="222" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#777B80">Academic &amp; Applied Project</text>
</svg>